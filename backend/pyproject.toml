[project]
name = "tulipsedu-backend"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: read-only invariant audit against the REAL tenants (no writes). Run with -m live.",
]
# Default gate run excludes the live audit: `pytest -m 'not live'`
# Live audit (cron / on-demand):                `pytest -m live`
