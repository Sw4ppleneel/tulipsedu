services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tulips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tulipsedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tulips} -d ${POSTGRES_DB:-tulipsedu}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tulips}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tulipsedu}
      WORKERS: "4"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - ./index.html:/usr/share/nginx/landing/index.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - internal
      - public

  # Run once to build frontend: docker compose -f docker-compose.prod.yml run --rm frontend_build
  frontend_build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "npm ci && npm run build"
    profiles:
      - build

volumes:
  postgres_data:
  frontend_dist:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
