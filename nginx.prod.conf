events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=120r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect (apex, www, and all tenant subdomains) ─────────
    server {
        listen 80;
        server_name tulipsedu.in www.tulipsedu.in ~^.+\.tulipsedu\.in$;

        # Allow certbot ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS apex marketing site (tulipsedu.in + www) ───────────────────────
    # Exact server_name wins over the tenant regex block below, so the apex
    # serves the static landing page while *.tulipsedu.in serves the SPA.
    server {
        listen 443 ssl http2;
        server_name tulipsedu.in www.tulipsedu.in;

        ssl_certificate     /etc/letsencrypt/live/tulipsedu.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tulipsedu.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options            SAMEORIGIN                           always;
        add_header X-Content-Type-Options     nosniff                              always;
        add_header X-XSS-Protection           "1; mode=block"                      always;
        add_header Referrer-Policy            strict-origin-when-cross-origin      always;

        root  /usr/share/nginx/landing;
        index index.html;

        # The landing page is a single self-contained HTML file (inline CSS/JS,
        # fonts from Google CDN). Never cache the HTML so content updates land.
        location = /index.html {
            expires    -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            try_files $uri /index.html;
            limit_req zone=general burst=20;
        }
    }

    # ── HTTPS tenant app ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ~^(?<tenant>[^.]+)\.tulipsedu\.in$;

        ssl_certificate     /etc/letsencrypt/live/tulipsedu.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tulipsedu.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options            SAMEORIGIN                           always;
        add_header X-Content-Type-Options     nosniff                              always;
        add_header X-XSS-Protection           "1; mode=block"                      always;
        add_header Referrer-Policy            strict-origin-when-cross-origin      always;

        # Auth endpoints — hard rate limit (10 req/min, burst 5)
        location ~ ^/api/v1/(auth|parent/auth)/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # API endpoints — standard rate limit
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # Health check (no rate limit)
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # Immutable static assets (hashed filenames from Vite build)
        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        # HTML — never cache (Preact SPA shell)
        location = /index.html {
            root       /usr/share/nginx/html;
            expires    -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # SPA fallback
        location / {
            root       /usr/share/nginx/html;
            try_files  $uri $uri/ /index.html;
            limit_req  zone=general burst=20;
        }
    }
}
