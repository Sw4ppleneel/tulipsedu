# Disposable stack for the pre-deploy gate (scripts/predeploy_gate.sh).
# Builds the backend from source against a throwaway Postgres, then a test
# runner executes the L1 write-path suite (-m "not live") against it. Nothing
# here touches prod — it is a self-contained, `down -v`-able stack.
services:
  gate-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tulips
      POSTGRES_PASSWORD: tulips
      POSTGRES_DB: tulipsedu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tulips -d tulipsedu"]
      interval: 3s
      timeout: 3s
      retries: 20

  gate-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      # entrypoint applies migrations then starts gunicorn on :8000
      DATABASE_URL: postgresql://tulips:tulips@gate-db:5432/tulipsedu
      SECRET_KEY: gate-secret-not-prod
    depends_on:
      gate-db:
        condition: service_healthy

  gate-tests:
    image: python:3.12-slim
    working_dir: /repo/backend
    volumes:
      - ./:/repo
    environment:
      DATABASE_URL: postgresql://tulips:tulips@gate-db:5432/tulipsedu
      BASE_URL: http://gate-backend:8000
    # install runtime deps (from requirements.txt — pyproject has no [project]
    # dependencies/[build-system], so `pip install -e .` would NOT pull them) plus
    # the test deps, wait for the app, then run the write-path suite.
    command:
      - sh
      - -c
      - |
        set -e
        pip install -q -r requirements.txt pytest pytest-asyncio httpx openpyxl
        python - <<'PY'
        import sys, time, urllib.request as u
        for _ in range(60):
            try:
                u.urlopen('http://gate-backend:8000/health'); sys.exit(0)
            except Exception:
                time.sleep(2)
        sys.exit("gate-backend never became healthy")
        PY
        pytest -m "not live" -q
    depends_on:
      - gate-backend
