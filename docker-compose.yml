services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tulips
      POSTGRES_PASSWORD: tulips
      POSTGRES_DB: tulipsedu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tulips -d tulipsedu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://tulips:tulips@postgres:5432/tulipsedu
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "false"
      BASE_DOMAIN: tulipsedu.in
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
